---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: tkachev
    group: tkachev
    mode: '0755'

- name: Copy Docker Compose configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/compose.yml"
    dest: "{{ deploy_dir }}/compose.yml"
    owner: tkachev
    group: tkachev
    mode: '0644'

- name: Create Docker Compose environment file
  ansible.builtin.copy:
    dest: "{{ deploy_dir }}/.env"
    content: |
      APP_VERSION={{ deploy_image_version }}
      POSTGRES_PASSWORD={{ vault_postgres_password }}
      STORAGE_S3_BUCKET=hexlet-bulletins-tkachev
      STORAGE_S3_REGION=ru-central1
      STORAGE_S3_ENDPOINT=https://storage.yandexcloud.net
      STORAGE_S3_ACCESSKEY={{ vault_s3_access_key }}
      STORAGE_S3_SECRETKEY={{ vault_s3_secret_key }}
    owner: tkachev
    group: tkachev
    mode: '0600'
  no_log: true

- name: Deploy application with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_dir }}"
    state: present
    pull: always
    remove_orphans: true
    wait: true
    wait_timeout: 120